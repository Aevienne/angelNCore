name: angelNCore
version: 1.0.0
main: me.angelique.angelNCore.AngelNCore
api-version: '1.21'
description: A supply and demand driven economy plugin
authors: [Aevienne]

commands:
  shop:
    description: Open the shop or view item prices
    usage: /shop [buy|sell|list] [item] [amount]
  balance:
    description: Check your balance
    usage: /balance [player]
    aliases: [bal]
  eco:
    description: Admin economy commands
    usage: /eco [give|take|set] [player] [amount]
    permission: economy.admin
  war:
    description: Declare or end wars
    usage: /war <declare|end> [args]
    permission: war.admin
  claim:
    description: Claim or manage land chunks
    usage: /claim <info|claim|release|list> [type]
  region:
    description: Admin region type management
    usage: /region settype <FERTILE|MINING|FUEL|CHOKEPOINT>
    permission: angelncore.admin
  bank:
    description: Banking commands for loans and repayments
    usage: /bank <loans|borrow|repay> [args]
  market:
    description: View cross-venue market prices
    usage: /market [info <item>]
  stock:
    description: Trade stocks in-game
    usage: /stock <list|portfolio|buy|sell|orders> [args]
  menu:
    description: Open the Angel Network hub menu
    usage: /menu
    aliases: [angel, hub, am]
  tutorial:
    description: Guided tutorial through all server features
    usage: /tutorial
    aliases: [guide, learn]
  backup:
    description: Backup the economy database
    usage: /backup
    permission: angelncore.admin

permissions:
  economy.admin:
    description: Access to admin economy commands
    default: op
  economy.use:
    description: Access to shop and balance commands
    default: true
  war.admin:
    description: Access to war commands
    default: op
